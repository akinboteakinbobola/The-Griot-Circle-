<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Griot Circle - ALL POSTS</title>
<style>
body{background:#0E1A2B;color:#fff;font-family:sans-serif;padding:16px}
#info{background:#16233A;border:1px solid #D4AF37;padding:10px;border-radius:8px;margin:10px 0}
.card{background:#16233A;border:1px solid rgba(212,175,55,.3);padding:12px;margin:10px 0;border-radius:10px}
.card h4{color:#FFC94A;font-size:14px}
a{color:#D4AF37;text-decoration:none}
.loader{text-align:center;padding:20px}
</style>
</head>
<body>
<h2>THE GRIOT CIRCLE - ALL POSTS (No Limit)</h2>
<div id="info">Counting all your Blogspot posts... (This loads ALL pages automatically)</div>
<div id="posts" class="loader">Loading page 1...</div>

<script>
let all=[];

async function fetchPage(start){
  let url=`https://akinbobolakinbote.blogspot.com/feeds/posts/default?alt=json&max-results=150&start-index=${start}`;
  let r=await fetch(url);
  if(!r.ok) return [];
  let j=await r.json();
  return j.feed.entry||[];
}

async function loadAll(){
  let start=1;
  let page=1;
  let postsDiv=document.getElementById('posts');
  
  while(true){
    postsDiv.innerHTML=`Loading page ${page}... Found ${all.length} so far...`;
    let entries=await fetchPage(start);
    if(entries.length===0) break;
    all=all.concat(entries);
    if(entries.length<150) break; // last page
    start+=150;
    page++;
  }

  document.getElementById('info').innerHTML=`✅ TOTAL LOADED: <b>${all.length} posts</b> from akinbobolakinbote.blogspot.com - Every single one!`;
  
  let html='';
  all.forEach(e=>{
    let t=e.title.$t;
    let link=(e.link.find(l=>l.rel=='alternate')||{}).href;
    let date=new Date(e.published.$t).toLocaleDateString();
    let snippet=(e.summary?e.summary.$t:(e.content?e.content.$t:'')).replace(/<[^>]*>/g,'').substring(0,120);
    html+=`<div class="card"><div style="font-size:10px;color:#D4AF37">${date}</div><h4><a href="${link}" target="_blank">${t}</a></h4><div style="font-size:11px;color:#aaa">${snippet}...</div><a href="${link}" target="_blank">Read →</a></div>`;
  });
  document.getElementById('posts').innerHTML=html;
}

loadAll();
</script>
</body>
</html>
