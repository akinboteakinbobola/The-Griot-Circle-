<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Griot Circle - Official</title>
<style>
:root{--gold:#D4AF37;--dark:#0E1A2B;--card:#16233A}
body{margin:0;background:var(--dark);color:#fff;font-family:Georgia,serif}
header{background:rgba(14,26,43,.95);border-bottom:2px solid var(--gold);padding:12px 16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;color:var(--gold);font-size:18px}
.search{padding:8px 12px;border-radius:20px;border:1px solid var(--gold);background:var(--card);color:#fff;width:40%}
.hero{background:linear-gradient(135deg,#0E1A2B 0%,#1a2a4a 100%);padding:30px 16px;text-align:center;border-bottom:1px solid var(--gold)}
.hero h2{color:var(--gold);font-size:28px;margin:0}
.grid{padding:16px;display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
article{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid rgba(212,175,55,.2)}
article img{width:100%;height:200px;object-fit:cover}
article.content{padding:12px}
article h3{color:#FFC94A;font-size:16px;margin:6px 0}
article p{color:#aaa;font-size:13px;line-height:1.5}
article.meta{font-size:10px;color:var(--gold)}
.fullpage{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--dark);z-index:20;overflow:auto;padding:16px}
.fullpage.active{display:block}
.fullpage img{max-width:100%;border-radius:8px}
.fullpage.close{background:var(--gold);color:#000;padding:10px 16px;border:none;border-radius:20px;position:sticky;top:10px}
</style>
</head>
<body>
<header>
<h1>THE GRIOT CIRCLE</h1>
<input id="search" class="search" placeholder="Search 46 posts... e.g. Garri, Ijebu">
</header>
<div class="hero">
<h2>From Tinubu Square to Global Stories</h2>
<p style="color:#ccc;font-size:13px">46 Stories by Akinbobola Akinbote - Food, History, Culture, Faith</p>
</div>
<div id="grid" class="grid">Loading your 46 posts as normal pages...</div>
<div id="full" class="fullpage">
<button class="close" onclick="document.getElementById('full').classList.remove('active')">← Back to all posts</button>
<div id="fullContent" style="margin-top:16px"></div>
</div>

<script>
let allPosts=[];
function getImageFromContent(content){
 let m=content.match(/<img[^>]+src="([^">]+)"/);
 return m?m[1]:'https://via.placeholder.com/400x200/16233A/D4AF37?text=THE+GRIOT+CIRCLE';
}

function handleBatch(json){
 let entries=json.feed.entry||[];
 if(allPosts.length===0 && json.feed.openSearch$totalResults){
  document.querySelector('.hero p').innerText=`${json.feed.openSearch$totalResults.$t} Stories by Akinbobola Akinbote - Food, History, Culture, Faith`;
 }
 entries.forEach(e=>{
  let title=e.title.$t;
  let content=e.content?e.content.$t:(e.summary?e.summary.$t:'');
  let link=(e.link.find(l=>l.rel==='alternate')||{}).href;
  let date=new Date(e.published.$t).toLocaleDateString();
  let img=getImageFromContent(content);
  let text=content.replace(/<[^>]*>/g,'').substring(0,150);
  allPosts.push({title,content,link,date,img,text});
 });

 if(json.feed.entry && allPosts.length < parseInt(json.feed.openSearch$totalResults.$t)){
  let next=allPosts.length+1;
  loadScript(next);
 } else {
  render(allPosts);
 }
}

function loadScript(start){
 let s=document.createElement('script');
 s.src=`https://akinbobolakinbote.blogspot.com/feeds/posts/default?alt=json&max-results=150&start-index=${start}&callback=handleBatch`;
 document.head.appendChild(s);
}

function render(list){
 let grid=document.getElementById('grid');
 grid.innerHTML='';
 list.forEach((p,i)=>{
  let art=document.createElement('article');
  art.innerHTML=`<img src="${p.img}" loading="lazy"><div class="content"><div class="meta">${p.date}</div><h3>${p.title}</h3><p>${p.text}...</p><button onclick="openFull(${i})" style="background:var(--gold);border:none;padding:6px 12px;border-radius:12px;margin-top:6px">Read full story</button></div>`;
  art.dataset.title=p.title.toLowerCase();
  grid.appendChild(art);
 });
}

function openFull(i){
 let p=allPosts[i];
 document.getElementById('fullContent').innerHTML=`<div style="color:var(--gold);font-size:11px">${p.date}</div><h1 style="color:#FFC94A">${p.title}</h1><div style="line-height:1.7;font-size:14px;color:#ddd">${p.content}</div><p><a href="${p.link}" target="_blank" style="color:var(--gold)">View original on Blogspot →</a></p>`;
 document.getElementById('full').classList.add('active');
 window.scrollTo(0,0);
}

document.getElementById('search').addEventListener('input',e=>{
 let q=e.target.value.toLowerCase();
 let filtered=allPosts.filter(p=>p.title.toLowerCase().includes(q) || p.text.toLowerCase().includes(q));
 render(filtered);
});

loadScript(1);
</script>
</body>
</html>
